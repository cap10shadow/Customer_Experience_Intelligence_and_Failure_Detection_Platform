services:
  postgres:
    image: postgres:15-alpine
    container_name: oi_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-operational_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-operational_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway_service:
    build:
      context: .
      dockerfile: backend/services/gateway_service/Dockerfile
    container_name: oi_gateway
    command: uvicorn backend.services.gateway_service.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${GATEWAY_SERVICE_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ingestion_service:
    build:
      context: .
      dockerfile: backend/services/ingestion_service/Dockerfile
    container_name: oi_ingestion
    command: uvicorn backend.services.ingestion_service.app.main:app --host 0.0.0.0 --port 8001 --reload
    # No host port mapping: ingestion_service is internal-only, reachable
    # from other containers via Docker service-name networking
    # (http://ingestion_service:8001) and from the browser only through
    # the Gateway. Only gateway_service and postgres are host-published.
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  nlp_service:
    build:
      context: .
      dockerfile: backend/services/nlp_service/Dockerfile
    container_name: oi_nlp
    command: uvicorn backend.services.nlp_service.app.main:app --host 0.0.0.0 --port 8002 --reload
    # No host port mapping: internal-only, same rationale as ingestion_service above.
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  anomaly_service:
    build:
      context: .
      dockerfile: backend/services/anomaly_service/Dockerfile
    container_name: oi_anomaly
    command: uvicorn backend.services.anomaly_service.app.main:app --host 0.0.0.0 --port 8003 --reload
    # No host port mapping: internal-only, same rationale as ingestion_service above.
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  root_cause_service:
    build:
      context: .
      dockerfile: backend/services/root_cause_service/Dockerfile
    container_name: oi_root_cause
    command: uvicorn backend.services.root_cause_service.app.main:app --host 0.0.0.0 --port 8004 --reload
    # No host port mapping: internal-only, same rationale as ingestion_service above.
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  business_impact_service:
    build:
      context: .
      dockerfile: backend/services/business_impact_service/Dockerfile
    container_name: oi_business_impact
    command: uvicorn backend.services.business_impact_service.app.main:app --host 0.0.0.0 --port 8005 --reload
    # No host port mapping: internal-only, same rationale as ingestion_service above.
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  recommendation_service:
    build:
      context: .
      dockerfile: backend/services/recommendation_service/Dockerfile
    container_name: oi_recommendation
    command: uvicorn backend.services.recommendation_service.app.main:app --host 0.0.0.0 --port 8006 --reload
    # No host port mapping: internal-only. This is the service that hosts
    # /internal/events/business-impact-completed -- removing the host
    # publish is what actually makes that route unreachable from outside
    # the Docker network (P1-4), not just a routing convention.
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  copilot_service:
    build:
      context: .
      dockerfile: backend/services/copilot_service/Dockerfile
    container_name: oi_copilot
    command: uvicorn backend.services.copilot_service.app.main:app --host 0.0.0.0 --port 8007 --reload
    # No host port mapping: internal-only, same rationale as ingestion_service above.
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8007/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  evaluation_service:
    build:
      context: .
      dockerfile: backend/services/evaluation_service/Dockerfile
    container_name: oi_evaluation
    command: uvicorn backend.services.evaluation_service.app.main:app --host 0.0.0.0 --port 8008 --reload
    # No host port mapping: internal-only. Also hosts
    # /internal/events/business-impact-completed -- see recommendation_service's note above.
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8008/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oi_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Phase 13 Batch 2 (AD-6): no VITE_API_BASE_URL override -- the
      # frontend's own default ('/api', frontend/src/app/configuration/
      # env.ts) now applies, routed through vite.config.ts's existing
      # `/api` -> gateway_service:8000 proxy. This makes the browser see
      # the API as same-origin (http://localhost:3000), which the
      # HttpOnly session cookie requires -- the previous absolute
      # cross-origin URL here is exactly the contradiction AD-6
      # documents and corrects (docs/DECISIONS.md, docs/architecture/
      # phase-13/PHASE_13_ARCHITECTURE.md §9).
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Phase 11 Batch 1 -- Observability Foundation.
  # Prometheus (metrics) + Loki/Promtail (logs). Tracing (OTel Collector,
  # Tempo) and Grafana are later batches (docs/architecture/phase-11/
  # PHASE_11_ARCHITECTURE.md) -- not added here.
  # ---------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: oi_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: oi_loki
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
    # No host port mapping: internal-only, same convention as every
    # backend service that isn't gateway_service -- only Grafana (a later
    # batch) needs to reach Loki, over the Compose network.
    volumes:
      - ./infrastructure/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: oi_promtail
    command:
      - "-config.file=/etc/promtail/promtail-config.yaml"
    volumes:
      - ./infrastructure/observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Read-only access to every container's own Docker json-file log --
      # the mechanism this batch's structured stdout logging (backend/
      # shared/logging/logger.py) is shipped through, with zero networking
      # dependency added to any backend service itself.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped

  # Phase 11 Batch 2 -- Distributed Tracing. Every backend service exports
  # OTLP traces to otel-collector, which forwards them to tempo. Direct
  # OTLP export to Tempo was deliberately not used (Phase 11 architecture
  # §3.2/§5): a Collector is the frozen topology.
  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    container_name: oi_otel_collector
    command:
      - "--config=/etc/otel-collector-config.yaml"
    # No host port mapping: internal-only -- only backend services (over
    # the Compose network) send OTLP here.
    volumes:
      - ./infrastructure/observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.5.0
    container_name: oi_tempo
    command:
      - "-config.file=/etc/tempo.yaml"
    # No host port mapping: internal-only, same convention as Loki --
    # only the OTel Collector (writer) and Grafana (reader, this batch)
    # need to reach Tempo, both over the Compose network.
    volumes:
      - ./infrastructure/observability/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped

  # Phase 11 Batch 4 -- Grafana: the operational visualization layer over
  # Prometheus/Loki/Tempo (Phase 11 architecture §3.9/§3.11). Datasources
  # and dashboards are file-provisioned (below) so a fresh `docker compose
  # up` reproduces the same Grafana configuration with no manual
  # click-through setup.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: oi_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # No new user-signup surface, no anonymous access -- Grafana's own
      # default admin flow only (Phase 11 architecture §5: auth/RBAC
      # integration with platform auth is explicitly deferred, not
      # replaced with a bespoke auth system here).
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      # F1: container keeps Grafana's own default internal port (3000);
      # only the host mapping moves, since the frontend already owns
      # host port 3000.
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
