# Phase 13 Batch 9 (AD-2, §20): production-like static serving for the
# built frontend bundle, used only by docker-compose.prod.yml's
# `frontend` service (production Docker stage, see ../frontend/Dockerfile).
#
# Same-origin architecture (AD-6, §9): the browser must see the API as
# same-origin so the HttpOnly session cookie round-trips correctly --
# this proxy is the production equivalent of vite.config.ts's dev-only
# `/api` -> gateway_service:8000 proxy. `gateway_service` is reachable
# here because docker-compose.prod.yml places this frontend service on
# the same `public` network as gateway_service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://gateway_service:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (react-router) -- an unmatched path falls back
    # to index.html, the same behavior the Vite dev server already
    # provides implicitly in development.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
