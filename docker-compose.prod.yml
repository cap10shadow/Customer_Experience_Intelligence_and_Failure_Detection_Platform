# Phase 13 Batch 9 (AD-2, docs/architecture/phase-13/PHASE_13_ARCHITECTURE.md
# §20; docs/DECISIONS.md AD-2): production-like Docker Compose
# configuration.
#
# `docker-compose.yml` remains the unmodified development configuration
# (bind mounts, --reload, the Vite dev server, host-published Postgres) --
# this file changes only *how* the same application topology is built and
# run, never *what* the platform does. A standalone, self-contained file
# (not a Compose override): Compose's merge semantics cannot *remove* a
# base file's bind-mount/port/command entries, only add/replace scalar
# fields, so an override could not actually achieve "no source bind
# mount"/"no --reload"/"no host-published Postgres" cleanly -- AD-2's own
# text explicitly permits "a Compose override or a self-contained file
# (a packaging detail left to implementation, not architecture)".
#
# Distinct project identity (`name:` below) and `oi_prod_*` container
# names -- this configuration's containers/volumes/networks never collide
# with the development configuration's, so both can be verified
# independently (and, if ever genuinely needed, run side by side) without
# one destroying the other's state.
#
# Start:  docker compose -f docker-compose.prod.yml up -d --build
# Stop:   docker compose -f docker-compose.prod.yml down
# Config check: docker compose -f docker-compose.prod.yml config --quiet

name: operational_intelligence_prod

networks:
  # Browser -> frontend/gateway_service only. gateway_service also joins
  # `internal` (below) so it can reach every backend service and
  # Postgres -- the one intentional bridge between the two networks,
  # exactly as AD-2/§20 specifies.
  public:
  # gateway_service + the 8 backend services + Postgres + the full
  # observability stack (Prometheus/Loki/Promtail/OTel Collector/
  # Tempo/Grafana) -- extended beyond §20's literal "8 backend services
  # + postgres" wording because Prometheus must reach every backend
  # service to scrape it, the OTel Collector must be reachable BY every
  # backend service, and Grafana must reach Prometheus/Loki/Tempo --
  # none of that existing scrape/log/trace architecture works if those
  # containers are left off the network that actually holds their real
  # targets.
  internal:

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: oi_prod_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Prototype-scope default, identical to the development
      # configuration's -- §19 of the frozen architecture already
      # flags this as requiring rotation for any real deployment; this
      # batch does not invent a secrets-management platform, it reuses
      # the existing env-injection convention (.env, never committed).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-operational_intelligence}
    # No `ports:` -- §20: Postgres is not published to the host in the
    # production-like configuration. Every application service reaches
    # it over the `internal` network by service name (`postgres`),
    # never `localhost`. `backend/tooling/backup_restore/` (Batch 7)
    # already runs `pg_dump`/`pg_restore` via `docker compose exec`,
    # which needs no host port either way.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-operational_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway_service:
    build:
      context: .
      dockerfile: backend/services/gateway_service/Dockerfile
    container_name: oi_prod_gateway
    # No `command:` override -- the image's own Dockerfile CMD runs
    # (no --reload). No source bind mount -- the image's own COPYed
    # source is authoritative, per §20.
    # No host port published for the API directly -- the frontend's
    # nginx reverse-proxies `/api/*` to this service over the `public`
    # network (same-origin architecture, AD-6/§9), the production
    # equivalent of the development Vite proxy. Gateway remains the
    # sole public API boundary conceptually; only the frontend's own
    # port is host-published.
    env_file:
      - .env
    networks:
      - public
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  ingestion_service:
    build:
      context: .
      dockerfile: backend/services/ingestion_service/Dockerfile
    container_name: oi_prod_ingestion
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  nlp_service:
    build:
      context: .
      dockerfile: backend/services/nlp_service/Dockerfile
    container_name: oi_prod_nlp
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  anomaly_service:
    build:
      context: .
      dockerfile: backend/services/anomaly_service/Dockerfile
    container_name: oi_prod_anomaly
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  root_cause_service:
    build:
      context: .
      dockerfile: backend/services/root_cause_service/Dockerfile
    container_name: oi_prod_root_cause
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  business_impact_service:
    build:
      context: .
      dockerfile: backend/services/business_impact_service/Dockerfile
    container_name: oi_prod_business_impact
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  recommendation_service:
    build:
      context: .
      dockerfile: backend/services/recommendation_service/Dockerfile
    container_name: oi_prod_recommendation
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  copilot_service:
    build:
      context: .
      dockerfile: backend/services/copilot_service/Dockerfile
    container_name: oi_prod_copilot
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8007/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  evaluation_service:
    build:
      context: .
      dockerfile: backend/services/evaluation_service/Dockerfile
    container_name: oi_prod_evaluation
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8008/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # The production stage: `npm run build` (already scripted, never
      # invoked before this batch) + nginx serving the built bundle +
      # reverse-proxying `/api/*` to gateway_service (see
      # frontend/nginx.conf) -- no Vite dev server, no source bind mount.
      target: production
    container_name: oi_prod_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - public
    depends_on:
      - gateway_service
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # Observability -- identical images/config files to the development
  # configuration (Phase 11); only network placement changes here. Every
  # scrape/log-ship/trace-export target is already addressed by Compose
  # service name (verified: prometheus.yml, the Grafana datasource
  # provisioning, the OTel Collector config, and promtail-config.yaml
  # contain zero `localhost`/dev-only addresses) -- no observability
  # configuration file changes when layered onto this topology.
  # ---------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: oi_prod_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    container_name: oi_prod_loki
    command:
      - "-config.file=/etc/loki/loki-config.yaml"
    volumes:
      - ./infrastructure/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - internal
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    container_name: oi_prod_promtail
    command:
      - "-config.file=/etc/promtail/promtail-config.yaml"
    volumes:
      - ./infrastructure/observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - internal
    depends_on:
      - loki
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    container_name: oi_prod_otel_collector
    command:
      - "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./infrastructure/observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    networks:
      - internal
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.5.0
    container_name: oi_prod_tempo
    command:
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./infrastructure/observability/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - internal
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: oi_prod_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - internal
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
